name: quality-gate

on:
  push:
  pull_request:

jobs:
  quality-gate:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      # 棘轮：2026-10-29 实测行 83.51% / 分支 62.04%，各取 81 / 60 留约 2 点余量
      # （原行阈值 60 形同虚设）。与 scripts/quality-gate.ps1 的默认值保持一致，提升后同步上调。
      MIN_LINE_COVERAGE: '81'
      MIN_BRANCH_COVERAGE: '60'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run quality gate
        shell: pwsh
        run: ./scripts/quality-gate.ps1
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-and-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
